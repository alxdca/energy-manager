services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: energy_manager
      POSTGRES_USER: energy
      # Local development only; choose a private password for other deployments.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-energy}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - energy-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  energy-postgres-data:
